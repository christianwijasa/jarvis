name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build binaries
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          LDFLAGS="-X github.com/christianwijasabfi/atlas/internal/buildinfo.Version=${TAG}"
          mkdir -p dist
          for spec in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            os="${spec%/*}"
            arch="${spec#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -ldflags "$LDFLAGS" -o "dist/atlas-${os}-${arch}" .
          done
          (cd dist && sha256sum atlas-darwin-arm64 atlas-darwin-amd64 atlas-linux-amd64 atlas-linux-arm64) > dist/SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/atlas-darwin-arm64 \
            dist/atlas-darwin-amd64 \
            dist/atlas-linux-amd64 \
            dist/atlas-linux-arm64 \
            dist/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
